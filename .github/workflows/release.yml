name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 0.3.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install tools with mise
        uses: jdx/mise-action@v4

      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be SemVer, such as 0.3.0 or 0.4.0-rc.1" >&2
            exit 1
          fi

          tag="v${version}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check source
        run: mise run check

      - name: Build release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="localfwd_${VERSION}_${os}_${arch}"
            package_dir="dist/${name}"
            mkdir -p "$package_dir"

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "${package_dir}/localfwd" \
              ./cmd/localfwd

            cp README.md LICENSE "$package_dir/"
            tar -C "$package_dir" -czf "dist/${name}.tar.gz" \
              localfwd README.md LICENSE
          done

          cd dist
          sha256sum ./*.tar.gz > checksums.txt

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"

          {
            echo "## Changes"
            echo
            if [[ -n "$previous_tag" ]]; then
              git log --first-parent --reverse --pretty='- %s (`%h`)' "${previous_tag}..HEAD"
            else
              git log --first-parent --reverse --pretty='- %s (`%h`)'
            fi
          } > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            ./dist/*.tar.gz \
            ./dist/checksums.txt \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md
